<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>סינון מדיה</title>
<style>
  :root{
    --bg:#faf8f5; --card:#fff; --line:#ddd6cc; --ink:#2a241d; --muted:#7a7266;
    --need:#2e7d46; --no:#a33; --maybe:#b8860b; --accent:#8a5a2b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}
  #progress{color:var(--muted)}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}
  button.primary:hover{opacity:.9}
  .wrap{max-width:1500px;margin:0 auto;padding:16px}
  .section-nav{display:flex;gap:6px;flex-wrap:wrap}
  .section-nav-btn{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
  .section-nav-btn:hover{background:var(--accent);color:#fff}

  /* Section B — selected-by-page, fully separate from the galleries */
  #pages-section{background:#fff8ee;border:1px solid #e8d9bd;border-radius:10px;padding:14px;margin-bottom:26px}
  #pages-section > h2{margin:0 0 4px}
  #pages-section > p.hint{color:var(--muted);margin:0 0 12px}
  .page-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
  .page-card h3{margin:0 0 8px;font-size:15px}
  .page-card .thumbs{display:flex;flex-wrap:wrap;gap:8px}
  .page-thumb{width:64px;height:64px;border-radius:6px;overflow:hidden;position:relative;border:2px solid var(--line)}
  .page-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .page-thumb.is-current{border-color:var(--accent)}
  .page-thumb.is-joining{border-color:var(--need)}
  .page-thumb .tag{position:absolute;bottom:0;insetInlineStart:0;font-size:9px;background:rgba(0,0,0,.6);color:#fff;padding:1px 3px;width:100%;text-align:center}
  .page-card textarea{width:100%;margin-top:8px;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px}
  .page-empty{color:var(--muted);font-size:13px}

  /* Three separate galleries — old-site / aviv / live-theme, never mixed */
  .gallery-section{margin-bottom:34px;border-top:3px solid var(--accent);padding-top:14px;scroll-margin-top:120px}
  .gallery-section h2{margin:0;font-size:19px}
  .gallery-titlerow{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .section-toggle{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
  .gallery-section .gallery-sub{color:var(--muted);margin:0 0 10px;font-size:13px}
  .filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .filter-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer}
  .filter-chip.is-on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Fewer per row, more aligned — this is a work file, not a showcase (Nimrod) */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
  .tile.focused{outline:3px solid var(--accent)}
  .tile.is-hidden{display:none}
  .tile .imgwrap{aspect-ratio:4/3;min-height:0;overflow:hidden;background:#eee;position:relative}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .meta{padding:8px}
  .tile .id{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);direction:ltr;text-align:end}
  .tile .colls{font-size:11px;color:var(--muted);margin-bottom:6px}
  .tile .marks{display:flex;gap:4px;margin-bottom:6px}
  .tile .marks button{flex:1;border:1px solid var(--line);background:#fff;border-radius:4px;padding:5px 2px;font-size:12px;cursor:pointer}
  .tile .marks button.on-need{background:var(--need);color:#fff;border-color:var(--need)}
  .tile .marks button.on-no{background:var(--no);color:#fff;border-color:var(--no)}
  .tile .marks button.on-maybe{background:var(--maybe);color:#fff;border-color:var(--maybe)}
  .tile select, .tile textarea, .tile input[type=text]{width:100%;font-size:12px;border:1px solid var(--line);border-radius:4px;margin-top:4px;font-family:inherit;padding:4px}
  .tile textarea{resize:vertical;min-height:36px}
  .tile .meta-summary{font-size:11px;margin-top:6px;padding:5px 7px;border-radius:4px;border-inline-start:3px solid transparent;display:flex;flex-direction:column;gap:2px}
  .tile .meta-summary--found{border-inline-start-color:var(--need);background:#eaf5ec}
  .tile .meta-summary--missing{border-inline-start-color:var(--no);background:#fbeaea;color:var(--no)}
  .tile .meta-summary .field-line{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .tile .meta-summary .field-line b{color:var(--need);font-weight:600}
  #sentinel-tpl{height:1px}
  .loadstatus{text-align:center;color:var(--muted);padding:16px}
  .kbd-hint{color:var(--muted);font-size:12px}

  /* Lightbox — click any thumbnail for a large view with prev/next + all fields */
  .lightbox{position:fixed;inset:0;z-index:100}
  .lightbox-backdrop{position:absolute;inset:0;background:rgba(20,15,8,.82)}
  .lightbox-panel{position:relative;max-width:1200px;max-height:92vh;margin:4vh auto;background:var(--card);border-radius:10px;overflow:auto;padding:20px;display:flex;flex-direction:column}
  .lightbox-close{position:absolute;top:14px;left:14px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  .lightbox-body{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
  .lightbox-imgside{flex:1 1 480px;min-width:320px}
  .lightbox-img{width:100%;max-height:70vh;object-fit:contain;background:#eee;border-radius:8px;display:block}
  .lightbox-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .lightbox-nav button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:14px;cursor:pointer}
  .lightbox-nav button:disabled{opacity:.35;cursor:default}
  .lightbox-pos{color:var(--muted);font-size:13px}
  /* Nimrod, 2026-09-17: every field in the lightbox one below the other, and
     everything right-aligned (RTL reading start) — no side-by-side layout. */
  .lightbox-fields{flex:1 1 320px;min-width:280px;display:flex;flex-direction:column;text-align:right}
  .lightbox-fields > *{width:100%;text-align:right}
  .lightbox-fields .id{font-size:13px}
  .lightbox-fields .colls{font-size:13px;margin-bottom:10px}
  .lightbox-fields .marks{display:flex;gap:6px}
  .lightbox-fields .marks button{flex:1;font-size:14px;padding:9px 4px;text-align:center}
  .lightbox-fields select,.lightbox-fields textarea,.lightbox-fields input[type=text]{width:100%;box-sizing:border-box;font-size:14px;text-align:right;margin-bottom:10px}
  .lightbox-fields textarea{min-height:70px}
  .lightbox-fields label{display:block;font-size:12px;color:var(--muted);margin-top:6px;text-align:right}
  .lightbox-fields .meta-block{margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
  .lightbox-fields .meta-status{font-size:12px;margin-bottom:8px}
  .lightbox-fields .meta-status--found{color:var(--need)}
  .lightbox-fields .meta-status--missing{color:var(--maybe)}
  .lightbox-fields .meta-approve{display:flex;flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px;font-size:13px}
  /* M-10, 2026-09-18 — alt-text review channel, live-theme images only */
  .lightbox-fields .alt-block{margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
  .lightbox-fields .alt-current{background:#eaf5ec;border-radius:4px;padding:6px 8px;margin-bottom:8px;font-size:13px}
  .lightbox-fields .alt-question{background:#fff4e5;border-inline-start:3px solid var(--maybe);border-radius:4px;padding:6px 8px;margin-bottom:8px;font-size:13px;font-weight:600}
  .lightbox-fields .alt-people{font-size:12px;color:var(--muted);margin-bottom:4px}
  .lightbox-fields .alt-where{font-size:12px;color:var(--muted);margin-bottom:8px}
  .tile .alt-summary{font-size:11px;margin-top:6px;padding:5px 7px;border-radius:4px;border-inline-start:3px solid transparent}
  .tile .alt-summary--found{border-inline-start-color:var(--need);background:#eaf5ec}
  .tile .alt-summary--missing{border-inline-start-color:var(--no);background:#fbeaea;color:var(--no)}
  .tile .alt-summary--question{border-inline-start-color:var(--maybe);background:#fff4e5;color:#8a6100;font-weight:600}
</style>
</head>
<body>
<header>
  <h1 id="page-title">סינון מדיה</h1>
  <span id="progress"></span>
  <span class="kbd-hint">מקלדת (כשתמונה בפוקוס): 1=נחוץ · 2=לא · 3=אולי · חץ=הבא/הקודם</span>
  <div id="section-nav" class="section-nav"></div>
  <button class="primary" id="btn-export" type="button">ייצוא JSON</button>
</header>
<div class="wrap">

  <section id="pages-section">
    <h2>נבחרו — לפי עמוד</h2>
    <p class="hint">כל עמודי התפריט הראשי באתר. לכל עמוד: מה מוגדר לו כרגע (מסגרת חומה), ומה סימנת שיצטרף אליו (מסגרת ירוקה). נפרד לגמרי מהגלריות שלמטה.</p>
    <div id="pages-list"></div>
  </section>

  <div id="galleries"></div>

</div>
<script>
const MEDIA_DATA = __MEDIA_DATA_JSON__;
</script>
<script>
(function(){
  'use strict';
  const LS_KEY = 'ea-media-filter-v1';
  const PAGE_SIZE = 40;
  const STATUS_LABELS = {need:'נחוץ', no:'לא נחוץ', maybe:'אולי'};
  const GROUP_ORDER = ['old-site', 'aviv', 'live-theme'];
  const GROUP_TITLES = {
    'old-site': 'אתר ישן',
    'aviv': 'חבילת אביב',
    'live-theme': 'משולב באתר כרגע'
  };
  const GROUP_SUB = {
    'old-site': 'כל תמונות הארכיון הישן. יש להן מטא-דאטה מהאתר הישן למטה — שימור SEO.',
    'aviv': 'התמונות שנשלחו על ידי אייל בדרייב, יום אחד, איכות גבוהה — נפרדות לגמרי מהארכיון הישן.',
    'live-theme': 'רק תמונות שבאמת מחוברות כרגע בקוד התמה הנוכחי — לא הצעות שלא חוברו.'
  };

  const images = MEDIA_DATA.images;   // [{id, sha256, src, collections, groupLabels, paths, oldSiteMeta}]
  const pages = MEDIA_DATA.pages;     // [{title, path}] — full main-menu list
  const pageAssignments = MEDIA_DATA.pageAssignments; // {pageTitle: [{slotId, section, role, currentImageId}]}
  const pageNames = pages.map(function(p){ return p.title; });

  function load(){
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; }
    catch(e){ return {}; }
  }
  function save(state){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){ /* quota */ }
  }
  var state = load();
  // state shape: { items: { [imageId]: {status, note, assignPage, metaTitle, metaAlt, metaCaption, metaApproved} }, pageNotes: { [page]: text } }
  if (!state.items) state.items = {};
  if (!state.pageNotes) state.pageNotes = {};
  if (!state.sectionCollapse) state.sectionCollapse = {};

  function getItem(id){
    return state.items[id] || {status:'', note:'', assignPage:'', metaTitle:'', metaAlt:'', metaCaption:'', metaApproved:false};
  }
  function setItem(id, patch){
    var cur = getItem(id);
    state.items[id] = Object.assign({}, cur, patch);
    save(state);
    refreshProgress();
    renderPagesSection();
  }

  function refreshProgress(){
    var marked = 0, withNote = 0;
    images.forEach(function(im){
      var it = state.items[im.id];
      if (it && it.status) marked++;
      if (it && it.note) withNote++;
    });
    document.getElementById('progress').textContent =
      marked + ' מתוך ' + images.length + ' סומנו · ' + withNote + ' עם הערה';
  }

  var imageById = {};
  images.forEach(function(im){ imageById[im.id] = im; });
  var galleriesByKey = {}; // populated as createGallery(groupKey) runs, below

  // ---------- Section B: selected-by-page ----------
  function renderPagesSection(){
    var wrap = document.getElementById('pages-list');
    wrap.innerHTML = '';
    pageNames.forEach(function(page){
      var rows = pageAssignments[page] || [];
      var card = document.createElement('div');
      card.className = 'page-card';
      var h3 = document.createElement('h3');
      h3.textContent = page + (rows.length ? ' (' + rows.length + ' סלוטים)' : '');
      card.appendChild(h3);

      var thumbs = document.createElement('div');
      thumbs.className = 'thumbs';
      var seen = {};
      rows.forEach(function(r){
        if (!r.currentImageId || seen[r.currentImageId]) return;
        seen[r.currentImageId] = true;
        var im = imageById[r.currentImageId];
        if (!im) return;
        thumbs.appendChild(makePageThumb(im, 'current', r.section || r.slotId));
      });
      images.forEach(function(im){
        var it = state.items[im.id];
        if (it && it.assignPage === page && !seen[im.id]) {
          seen[im.id] = true;
          thumbs.appendChild(makePageThumb(im, 'joining', 'מצטרף'));
        }
      });
      if (!thumbs.children.length) {
        var empty = document.createElement('p');
        empty.className = 'page-empty';
        empty.textContent = 'אין תמונות משויכות כרגע.';
        card.appendChild(empty);
      } else {
        card.appendChild(thumbs);
      }

      var ta = document.createElement('textarea');
      ta.placeholder = 'הערה לעמוד הזה';
      ta.value = state.pageNotes[page] || '';
      ta.addEventListener('input', function(){
        state.pageNotes[page] = ta.value;
        save(state);
      });
      card.appendChild(ta);

      wrap.appendChild(card);
    });
  }

  function makePageThumb(im, kind, label){
    var d = document.createElement('div');
    d.className = 'page-thumb ' + (kind === 'current' ? 'is-current' : 'is-joining');
    var img = document.createElement('img');
    img.src = im.src;
    img.loading = 'lazy';
    img.alt = im.id;
    d.appendChild(img);
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = label;
    d.appendChild(tag);
    return d;
  }

  // ---------- shared tile builder ----------
  function updateMarkButtons(marksEl, status){
    Array.prototype.forEach.call(marksEl.children, function(btn, i){
      var st = ['need','no','maybe'][i];
      btn.classList.toggle('on-' + st, st === status);
    });
  }

  function cssEscape(s){ return s.replace(/[^a-zA-Z0-9_-]/g, '\\\\$&'); }
  function truncate(s, n){ s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  // Shared by the grid tile (compact) and the lightbox (large) — one
  // implementation of "all of an image's fields", so the two views can never
  // drift out of sync with each other or with localStorage. Appends into
  // `container` and returns {marks, note, sel} so the caller can refresh them
  // on external state changes (e.g. markAndAdvance updating a tile that isn't
  // the one the user clicked).
  // mode: 'compact' (grid tile — display-only metadata, no inputs) or
  // 'full' (lightbox — every metadata field editable, one per row, for every
  // old-site image whether or not a match was found. Nimrod, 2026-09-17:
  // Eyal himself needs somewhere to type this in later, so the fields must
  // exist even when empty — a missing-data message alone isn't a field.)
  function attachFields(container, im, idx, gallery, mode){
    var idEl = document.createElement('div');
    idEl.className = 'id';
    idEl.textContent = im.id;
    container.appendChild(idEl);

    var colls = document.createElement('div');
    colls.className = 'colls';
    colls.textContent = im.groupLabels.join(' + ') + (im.paths.length > 1 ? ' (' + im.paths.length + ' עותקים)' : '');
    container.appendChild(colls);

    var marks = document.createElement('div');
    marks.className = 'marks';
    ['need','no','maybe'].forEach(function(st){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = STATUS_LABELS[st];
      b.addEventListener('click', function(){ gallery.markAndAdvance(im.id, st, idx); });
      marks.appendChild(b);
    });
    container.appendChild(marks);

    var sel = document.createElement('select');
    var optNone = document.createElement('option');
    optNone.value = ''; optNone.textContent = '— לא משויך לעמוד —';
    sel.appendChild(optNone);
    pageNames.forEach(function(p){
      var o = document.createElement('option');
      o.value = p; o.textContent = p;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){ setItem(im.id, {assignPage: sel.value}); });
    container.appendChild(sel);

    var note = document.createElement('textarea');
    note.placeholder = 'הערה';
    note.addEventListener('input', function(){ setItem(im.id, {note: note.value}); });
    container.appendChild(note);

    // Old-site metadata. Nimrod, 2026-09-17: fields must exist for EVERY
    // old-site image, found or not — someone (Eyal, later) needs a place to
    // type this in, not just a "missing" message. Grid tile: compact,
    // display-only summary. Lightbox: one real editable field per data point.
    if (im.collections.indexOf('old-site') !== -1) {
      var hasMeta = !!(im.oldSiteMeta && (im.oldSiteMeta.alt_text || im.oldSiteMeta.title || im.oldSiteMeta.caption || im.oldSiteMeta.description));
      var saved = state.items[im.id] || {};
      // shared by both modes: stateKey, oldSiteMeta key, full label (lightbox), tag, short label (compact)
      var fieldsSpec = [
        ['metaTitle', 'title', 'כותרת (מהאתר הישן)', 'input', 'כותרת'],
        ['metaAlt', 'alt_text', 'טקסט alt (מהאתר הישן)', 'input', 'alt'],
        ['metaCaption', 'caption', 'כיתוב (מהאתר הישן)', 'textarea', 'כיתוב'],
        ['metaDescription', 'description', 'תיאור (מהאתר הישן)', 'textarea', 'תיאור']
      ];
      function effectiveVal(spec){
        var stateKey = spec[0], metaKey = spec[1];
        var sv = saved[stateKey];
        if (sv != null && sv !== '') return sv;
        return (im.oldSiteMeta && im.oldSiteMeta[metaKey]) || '';
      }

      if (mode === 'full') {
        var block = document.createElement('div');
        block.className = 'meta-block';
        var status = document.createElement('div');
        status.className = hasMeta ? 'meta-status meta-status--found' : 'meta-status meta-status--missing';
        status.textContent = hasMeta ? 'נמצאה מטא-דאטה באתר הישן — ניתן לערוך.' : 'לא נמצאה מטא-דאטה באתר הישן לתמונה הזו — אפשר למלא כאן ידנית.';
        block.appendChild(status);

        var inputs = {};
        fieldsSpec.forEach(function(spec){
          var stateKey = spec[0], metaKey = spec[1], label = spec[2], tag = spec[3];
          var lbl = document.createElement('label');
          lbl.textContent = label;
          block.appendChild(lbl);
          var field = document.createElement(tag);
          if (tag === 'input') field.type = 'text';
          field.value = effectiveVal(spec);
          field.addEventListener('input', function(){
            var patch = {}; patch[stateKey] = field.value; setItem(im.id, patch);
          });
          block.appendChild(field);
          inputs[stateKey] = field;
        });

        var approveWrap = document.createElement('div');
        approveWrap.className = 'meta-approve';
        var approveChk = document.createElement('input');
        approveChk.type = 'checkbox';
        var approveId = 'approve-' + im.id + '-' + Math.random().toString(36).slice(2,7);
        approveChk.id = approveId;
        approveChk.checked = !!saved.metaApproved;
        approveChk.addEventListener('change', function(){ setItem(im.id, {metaApproved: approveChk.checked}); });
        var approveLbl = document.createElement('label');
        approveLbl.htmlFor = approveId;
        approveLbl.textContent = 'אושר לשימוש כמו שהוא';
        approveWrap.appendChild(approveChk);
        approveWrap.appendChild(approveLbl);
        block.appendChild(approveWrap);

        container.appendChild(block);
      } else {
        // compact: display-only, but Nimrod, 2026-09-17: show the actual
        // extracted/edited text itself, not a generic "exists" sentence —
        // green block when we have real data, red when we don't.
        var summary = document.createElement('div');
        summary.className = 'meta-summary ' + (hasMeta ? 'meta-summary--found' : 'meta-summary--missing');
        if (hasMeta) {
          var wroteAny = false;
          fieldsSpec.forEach(function(spec){
            var val = effectiveVal(spec);
            if (!val) return;
            wroteAny = true;
            var line = document.createElement('span');
            line.className = 'field-line';
            var b = document.createElement('b');
            b.textContent = spec[4] + ': ';
            line.appendChild(b);
            line.appendChild(document.createTextNode(truncate(val, 60)));
            summary.appendChild(line);
          });
          if (!wroteAny) summary.textContent = 'מטא-דאטה מהאתר הישן: חסרה (לחצו על התמונה למילוי)';
        } else {
          summary.textContent = 'מטא-דאטה מהאתר הישן: חסרה (לחצו על התמונה למילוי)';
        }
        container.appendChild(summary);
      }
    }

    // M-10, 2026-09-18 (team_00 via team_100): the gallery becomes Eyal's own
    // channel for correcting alt text, instead of a wp-admin path that does
    // not exist for these pages. Scoped to live-theme images only — this is
    // the ~250 actually on the site, not the full 939-image archive. A
    // sibling of the note/assignPage fields above: same setItem()/state.items
    // persistence, same full-vs-compact split. `im.currentAlt` and
    // `im.people`/`peopleConfidence`/`questionForEyal` come from
    // build_media_data.py's M-10 register (sha256-keyed, same join as the
    // old-site metadata above).
    if (im.collections.indexOf('live-theme') !== -1) {
      var altSaved = state.items[im.id] || {};
      var hasCurrentAlt = !!(im.currentAlt && im.currentAlt.trim());
      var hasQuestion = !!(im.questionForEyal && im.questionForEyal.trim());
      var peopleLabel = (im.people && im.people.length)
        ? 'מזוהה: ' + im.people.map(function(p){ return p === 'eyal' ? 'אייל עמית' : (p === 'mokesh' ? 'מוקש דהימן' : p); }).join(', ') + (im.peopleConfidence === 'uncertain' ? ' (לא ודאי — נא לאשר)' : '')
        : '';

      if (mode === 'full') {
        var altBlock = document.createElement('div');
        altBlock.className = 'alt-block';
        var altStatus = document.createElement('div');
        altStatus.className = 'meta-status ' + (hasQuestion ? 'meta-status--missing' : (hasCurrentAlt ? 'meta-status--found' : 'meta-status--missing'));
        altStatus.textContent = hasQuestion
          ? 'שאלת נגישות פתוחה לגבי התמונה הזו:'
          : (hasCurrentAlt ? 'טקסט הנגישות (alt) המוצג כרגע באתר:' : 'לתמונה הזו אין עדיין טקסט נגישות באתר.');
        altBlock.appendChild(altStatus);

        if (hasQuestion) {
          var qEl = document.createElement('div');
          qEl.className = 'alt-question';
          qEl.textContent = im.questionForEyal;
          altBlock.appendChild(qEl);
        } else if (hasCurrentAlt) {
          var curEl = document.createElement('div');
          curEl.className = 'alt-current';
          curEl.textContent = im.currentAlt;
          altBlock.appendChild(curEl);
        }

        if (peopleLabel) {
          var pplEl = document.createElement('div');
          pplEl.className = 'alt-people';
          pplEl.textContent = peopleLabel;
          altBlock.appendChild(pplEl);
        }

        if (im.renderedAt && im.renderedAt.length) {
          var whereEl = document.createElement('div');
          whereEl.className = 'alt-where';
          whereEl.textContent = 'מופיעה ב: ' + im.renderedAt.map(function(r){ return r.page || r.defaultsFile; }).join(', ');
          altBlock.appendChild(whereEl);
        }

        var altLbl = document.createElement('label');
        altLbl.textContent = hasQuestion ? 'התשובה שלך (או תיאור התמונה)' : 'תיקון או שיפור לטקסט הנגישות';
        altBlock.appendChild(altLbl);
        var altCorrection = document.createElement('textarea');
        altCorrection.placeholder = hasQuestion ? 'ענה כאן בבקשה' : 'השאר ריק אם הטקסט הקיים נכון';
        altCorrection.value = altSaved.altCorrection || '';
        altCorrection.addEventListener('input', function(){ setItem(im.id, {altCorrection: altCorrection.value}); });
        altBlock.appendChild(altCorrection);

        container.appendChild(altBlock);
      } else {
        var altSummary = document.createElement('div');
        var corrected = !!(altSaved.altCorrection && altSaved.altCorrection.trim());
        altSummary.className = 'alt-summary ' + (hasQuestion ? 'alt-summary--question' : (hasCurrentAlt ? 'alt-summary--found' : 'alt-summary--missing'));
        if (hasQuestion) {
          altSummary.textContent = (corrected ? '✓ ' : '') + 'שאלה: ' + truncate(im.questionForEyal, 70);
        } else if (hasCurrentAlt) {
          altSummary.textContent = (corrected ? '✓ תוקן: ' : 'alt: ') + truncate(corrected ? altSaved.altCorrection : im.currentAlt, 70);
        } else {
          altSummary.textContent = 'אין עדיין טקסט נגישות לתמונה זו';
        }
        container.appendChild(altSummary);
      }
    }

    var it = state.items[im.id];
    if (it) {
      if (it.status) { updateMarkButtons(marks, it.status); }
      if (it.note) note.value = it.note;
      if (it.assignPage) sel.value = it.assignPage;
    }

    return {marks: marks, note: note, sel: sel};
  }

  function makeTile(im, idx, gallery){
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.idx = idx;
    tile.dataset.id = im.id;
    tile.tabIndex = 0;

    var imgwrap = document.createElement('div');
    imgwrap.className = 'imgwrap';
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.src = im.src;
    img.alt = im.id;
    img.style.cursor = 'zoom-in';
    img.title = 'לחיצה להצגה בגדול';
    img.addEventListener('click', function(ev){
      ev.stopPropagation();
      openLightbox(gallery, idx);
    });
    imgwrap.appendChild(img);
    tile.appendChild(imgwrap);

    var meta = document.createElement('div');
    meta.className = 'meta';
    attachFields(meta, im, idx, gallery, 'compact');
    tile.appendChild(meta);

    tile.addEventListener('focus', function(){ gallery.setFocused(idx); });
    tile.addEventListener('keydown', function(ev){
      if (ev.target !== tile) return; // don't hijack typing in the tile's own inputs
      if (ev.key === '1') { gallery.markAndAdvance(im.id, 'need', idx); }
      else if (ev.key === '2') { gallery.markAndAdvance(im.id, 'no', idx); }
      else if (ev.key === '3') { gallery.markAndAdvance(im.id, 'maybe', idx); }
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') { gallery.focusIndex(idx+1); }
      else if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') { gallery.focusIndex(idx-1); }
      else if (ev.key === 'Enter' || ev.key === ' ') { openLightbox(gallery, idx); }
      else { return; }
      ev.preventDefault();
    });

    return tile;
  }

  // ---------- lightbox: large image + full fields + prev/next through the
  // gallery's CURRENT filtered list (so it always matches what's on screen) ----------
  var lightboxEl = null;
  function ensureLightbox(){
    if (lightboxEl) return lightboxEl;
    var el = document.createElement('div');
    el.className = 'lightbox';
    el.hidden = true;
    el.innerHTML =
      '<div class="lightbox-backdrop"></div>' +
      '<div class="lightbox-panel" role="dialog" aria-modal="true">' +
        '<button type="button" class="lightbox-close" aria-label="סגירה">✕ סגירה</button>' +
        '<div class="lightbox-body">' +
          '<div class="lightbox-imgside">' +
            '<img class="lightbox-img" alt="">' +
            '<div class="lightbox-nav">' +
              '<button type="button" class="lightbox-prev">→ הקודם</button>' +
              '<span class="lightbox-pos"></span>' +
              '<button type="button" class="lightbox-next">הבא ←</button>' +
            '</div>' +
          '</div>' +
          '<div class="lightbox-fields"></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(el);
    el.querySelector('.lightbox-backdrop').addEventListener('click', closeLightbox);
    el.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function(ev){
      if (lightboxEl.hidden) return;
      if (ev.key === 'Escape') { closeLightbox(); }
      else if (ev.key === 'ArrowRight') { navLightbox(-1); }
      else if (ev.key === 'ArrowLeft') { navLightbox(1); }
      else { return; }
      ev.preventDefault();
    });
    lightboxEl = el;
    return el;
  }

  var lightboxState = {gallery: null, idx: -1};

  function openLightbox(gallery, idx){
    var el = ensureLightbox();
    var list = gallery.getFiltered();
    if (idx < 0 || idx >= list.length) return;
    lightboxState.gallery = gallery;
    lightboxState.idx = idx;
    var im = list[idx];

    var img = el.querySelector('.lightbox-img');
    img.src = im.src;
    img.alt = im.id;

    el.querySelector('.lightbox-pos').textContent = (idx + 1) + ' מתוך ' + list.length;
    el.querySelector('.lightbox-prev').disabled = idx <= 0;
    el.querySelector('.lightbox-next').disabled = idx >= list.length - 1;

    var fieldsWrap = el.querySelector('.lightbox-fields');
    fieldsWrap.innerHTML = '';
    // The lightbox's own index into `list` doubles as the gallery-relative
    // index for markAndAdvance/focus — correct as long as we always read the
    // list fresh via getFiltered(), which gallery.markAndAdvance also does.
    attachFields(fieldsWrap, im, idx, gallery, 'full');

    el.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    if (!lightboxEl) return;
    lightboxEl.hidden = true;
    document.body.style.overflow = '';
  }

  function navLightbox(delta){
    if (!lightboxState.gallery) return;
    var list = lightboxState.gallery.getFiltered();
    var next = lightboxState.idx + delta;
    if (next < 0 || next >= list.length) return;
    openLightbox(lightboxState.gallery, next);
  }

  (function wireLightboxNav(){
    ensureLightbox();
    lightboxEl.querySelector('.lightbox-prev').addEventListener('click', function(){ navLightbox(-1); });
    lightboxEl.querySelector('.lightbox-next').addEventListener('click', function(){ navLightbox(1); });
  })();

  // ---------- one gallery: own filter state + own windowed rendering ----------
  function createGallery(groupKey){
    var all = images.filter(function(im){ return im.collections.indexOf(groupKey) !== -1; });
    var filtered = all;
    var rendered = 0;
    var filterState = 'all';

    var section = document.createElement('section');
    section.className = 'gallery-section';
    section.id = 'gallery-section-' + groupKey;

    var titleRow = document.createElement('div');
    titleRow.className = 'gallery-titlerow';
    var h2 = document.createElement('h2');
    h2.textContent = GROUP_TITLES[groupKey] + ' — ' + all.length + ' תמונות';
    titleRow.appendChild(h2);
    var toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'section-toggle';
    titleRow.appendChild(toggleBtn);
    section.appendChild(titleRow);

    var body = document.createElement('div');
    body.className = 'gallery-body';

    var sub = document.createElement('p');
    sub.className = 'gallery-sub';
    sub.textContent = GROUP_SUB[groupKey];
    body.appendChild(sub);

    var filterRow = document.createElement('div');
    filterRow.className = 'filter-row';
    var filters = [['all','הכל'],['need','נחוץ'],['no','לא נחוץ'],['maybe','אולי'],['unset','לא סומן']];
    var chips = {};
    filters.forEach(function(f){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'filter-chip' + (f[0] === 'all' ? ' is-on' : '');
      chip.textContent = f[1];
      chip.addEventListener('click', function(){ applyFilter(f[0]); });
      chips[f[0]] = chip;
      filterRow.appendChild(chip);
    });
    body.appendChild(filterRow);

    var grid = document.createElement('div');
    grid.className = 'grid';
    body.appendChild(grid);
    var sentinel = document.createElement('div');
    sentinel.id = 'sentinel-tpl';
    body.appendChild(sentinel);
    var loadstatus = document.createElement('div');
    loadstatus.className = 'loadstatus';
    body.appendChild(loadstatus);
    section.appendChild(body);

    function setCollapsed(val){
      body.hidden = val;
      toggleBtn.textContent = val ? '+ הרחבת הסקשן' : '— כיווץ הסקשן';
      state.sectionCollapse[groupKey] = val;
      save(state);
    }
    toggleBtn.addEventListener('click', function(){ setCollapsed(!body.hidden); });
    setCollapsed(!!state.sectionCollapse[groupKey]);

    var gallery = {};

    function applyFilter(key){
      filterState = key;
      Object.keys(chips).forEach(function(k){ chips[k].classList.toggle('is-on', k === key); });
      filtered = all.filter(function(im){
        if (key === 'all') return true;
        var it = state.items[im.id];
        if (key === 'unset') return !it || !it.status;
        return it && it.status === key;
      });
      grid.innerHTML = '';
      rendered = 0;
      renderMore();
    }

    function renderMore(){
      var next = filtered.slice(rendered, rendered + PAGE_SIZE);
      next.forEach(function(im, i){
        grid.appendChild(makeTile(im, rendered + i, gallery));
      });
      rendered += next.length;
      loadstatus.textContent = rendered < filtered.length
        ? ('נטענו ' + rendered + ' מתוך ' + filtered.length + ' — גוללים לעוד')
        : (filtered.length ? ('כל ' + filtered.length + ' נטענו') : 'אין תמונות בסינון הזה');
    }

    gallery.getFiltered = function(){ return filtered; };
    // Jumping to a later section needs every earlier section fully rendered
    // first — otherwise the target's real position keeps growing as those
    // sections lazy-load more tiles, and the jump lands short.
    gallery.renderAll = function(){ while (rendered < filtered.length) renderMore(); };
    gallery.markAndAdvance = function(id, status, idx){
      var cur = getItem(id);
      var next = cur.status === status ? '' : status;
      setItem(id, {status: next});
      var tile = grid.querySelector('[data-id="' + cssEscape(id) + '"]');
      if (tile) updateMarkButtons(tile.querySelector('.marks'), next);
      // a status change can remove the item from the current filter (e.g. was
      // "unset", now "need" while viewing the "unset" chip) — re-apply so the
      // grid stays honest about what the filter claims to show. If the marked
      // item got removed, everything after it shifts up by one, so "the next
      // item" is now sitting at the same idx rather than idx+1.
      var stayedInFilter = true;
      if (filterState !== 'all') {
        applyFilter(filterState);
        stayedInFilter = filtered[idx] && filtered[idx].id === id;
      }
      var nextIdx = stayedInFilter ? idx + 1 : idx;
      gallery.focusIndex(nextIdx);
      // "דפדוף" — if this mark came from the lightbox showing this exact
      // image, browse the lightbox onward too, not just the background grid.
      if (lightboxState.gallery === gallery && lightboxState.idx === idx && !lightboxEl.hidden) {
        if (nextIdx < filtered.length) { openLightbox(gallery, nextIdx); }
        else { closeLightbox(); }
      }
    };
    gallery.focusIndex = function(idx){
      if (idx < 0) return;
      while (idx >= rendered && rendered < filtered.length) renderMore();
      var tile = grid.children[idx];
      if (tile) tile.focus();
    };
    gallery.setFocused = function(idx){
      Array.prototype.forEach.call(grid.children, function(t){ t.classList.remove('focused'); });
      var tile = grid.children[idx];
      if (tile) tile.classList.add('focused');
    };

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting && rendered < filtered.length) renderMore();
      });
    }, {rootMargin: '600px'});
    io.observe(sentinel);

    renderMore();
    document.getElementById('galleries').appendChild(section);
    galleriesByKey[groupKey] = gallery;
    return gallery;
  }

  // ---------- export ----------
  document.getElementById('btn-export').addEventListener('click', function(){
    var items = [];
    images.forEach(function(im){
      var it = state.items[im.id];
      if (it && (it.status || it.note || it.metaApproved || it.metaAlt || it.metaTitle || it.metaCaption || it.metaDescription || it.altCorrection)) {
        items.push({
          id: im.id,
          filename: (im.paths[0] || {}).filename || '',
          src: im.src,
          collections: im.collections,
          status: it.status || '',
          note: it.note || '',
          assignedPage: it.assignPage || '',
          oldSiteMetadata: im.collections.indexOf('old-site') !== -1 ? {
            title: it.metaTitle || (im.oldSiteMeta && im.oldSiteMeta.title) || '',
            altText: it.metaAlt || (im.oldSiteMeta && im.oldSiteMeta.alt_text) || '',
            caption: it.metaCaption || (im.oldSiteMeta && im.oldSiteMeta.caption) || '',
            description: it.metaDescription || (im.oldSiteMeta && im.oldSiteMeta.description) || '',
            approved: !!it.metaApproved,
            foundInOldSite: !!(im.oldSiteMeta),
            wpId: (im.oldSiteMeta && im.oldSiteMeta.wp_id) || null
          } : null,
          oldSitePages: im.oldSitePages || [],
          oldSiteAlt: im.oldSiteAlt || null,
          // M-10, 2026-09-18: alt-text review round-trip, live-theme only.
          // currentAlt/people/peopleConfidence/questionForEyal are what we
          // measured — carried along so a correction is legible without
          // cross-referencing the site; altCorrection is Eyal's own edit.
          altReview: im.collections.indexOf('live-theme') !== -1 ? {
            currentAlt: im.currentAlt || '',
            renderedAt: im.renderedAt || [],
            people: im.people || [],
            peopleConfidence: im.peopleConfidence || null,
            questionForEyal: im.questionForEyal || null,
            correction: it.altCorrection || ''
          } : null
        });
      }
    });
    var payload = {
      schemaVersion: 2,
      exportType: 'ea-media-filter',
      exportTimestamp: new Date().toISOString(),
      totalImages: images.length,
      markedCount: items.length,
      items: items,
      pageNotes: state.pageNotes
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ea-media-filter-' + new Date().toISOString().replace(/[:.]/g,'-') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // ---------- boot ----------
  (function proveNoDuplicates(){
    var ids = images.map(function(im){ return im.id; });
    var uniqueIds = new Set(ids);
    var ok = ids.length === uniqueIds.size;
    var title = 'סינון מדיה — ' + images.length + ' תמונות';
    document.title = title;
    document.getElementById('page-title').textContent = title;
    var check = document.createElement('div');
    check.style.cssText = 'font-size:12px;color:' + (ok ? 'var(--need)' : 'var(--no)');
    check.textContent = ok
      ? ('אומת בקוד: ' + images.length + ' רשומות, ' + uniqueIds.size + ' מזהים ייחודיים — תואם.')
      : ('שגיאה: ' + images.length + ' רשומות אבל רק ' + uniqueIds.size + ' מזהים ייחודיים — יש כפילות!');
    document.querySelector('header').appendChild(check);
    if (!ok) console.error('DUPLICATE IMAGE IDS DETECTED', ids.length, uniqueIds.size);
  })();

  (function buildSectionNav(){
    var nav = document.getElementById('section-nav');
    GROUP_ORDER.forEach(function(g){
      var count = images.filter(function(im){ return im.collections.indexOf(g) !== -1; }).length;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'section-nav-btn';
      btn.textContent = GROUP_TITLES[g] + ' (' + count + ')';
      btn.addEventListener('click', function(){
        // Every section before this one must be FULLY rendered first — while
        // an earlier section is still lazy-loading, this section's real
        // position keeps growing underneath it, so a jump computed against
        // the current (partial) layout lands short. Force those sections
        // complete, then jump (instant: 'smooth' would drag the sentinels of
        // sections along the way into view long enough to trigger the same
        // problem all over again mid-scroll).
        var myIdx = GROUP_ORDER.indexOf(g);
        GROUP_ORDER.slice(0, myIdx).forEach(function(prevKey){
          if (galleriesByKey[prevKey]) galleriesByKey[prevKey].renderAll();
        });
        var target = document.getElementById('gallery-section-' + g);
        if (target) target.scrollIntoView({behavior: 'auto', block: 'start'});
      });
      nav.appendChild(btn);
    });
  })();

  renderPagesSection();
  GROUP_ORDER.forEach(function(g){ createGallery(g); });
  refreshProgress();
})();
</script>
</body>
</html>
