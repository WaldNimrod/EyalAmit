body{margin:0;background:var(--bg);color:var(--body);font:16px/1.65 "Heebo",Arial,sans-serif}

<header>
<h1>אישור תיאורי תמונות</h1>
<p><b>כל תיאור כאן נכתב אחרי התבוננות בתמונה עצמה</b>, לא לפי שם הקובץ ולא לפי הטקסט שסביבה.</p>
<p><b>התיאורים כבר עודכנו באתר.</b> הדף הזה נועד לתיקונים בלבד.</p>
<p><b>שדה ריק = מאשר.</b> יש לכתוב רק היכן שצריך לתקן, ואז ללחוץ על כפתור הייצוא ולשלוח לנו את הקובץ.</p>
</header>

</div>

const KEY = 'ea-alt-fixes-v1';
let fixes = {};
try { fixes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { fixes = {}; }
const list = document.getElementById('list');
const cnt  = document.getElementById('cnt');
function refresh(){
  const n = Object.values(fixes).filter(v => v && v.trim()).length;
  cnt.textContent = n ? (n + ' תיקונים ממתינים לייצוא') : 'אין תיקונים — הכל מאושר';
}
DATA.forEach((r, idx) => {
  const c = document.createElement('section');
  c.className = 'card' + (r.live ? '' : ' missing');
  const im = document.createElement('img');
  im.src = r.img; im.alt = r.alt || ''; im.loading = 'lazy';
  const box = document.createElement('div');
  const meta = document.createElement('p');
  meta.className = 'meta';
  const a = document.createElement('a');
  a.href = r.page; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = r.title || r.page;
  meta.appendChild(a);
  if (r.conf && r.conf !== 'high') {
    const t = document.createElement('span');
    t.className = 'tag ' + r.conf;
    t.textContent = r.conf === 'low' ? 'ודאות נמוכה' : 'ודאות בינונית';
    meta.appendChild(t);
  }
  const d = document.createElement('p');
  d.className = 'derived';
  d.textContent = r.alt || 'התמונה אינה נטענת מהשרת שלה — לא נכתב תיאור';
  const lab = document.createElement('label');
  lab.textContent = 'תיקון (ריק = מאשר)';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = fixes[idx] || '';
  inp.placeholder = 'רק אם צריך לשנות';
  inp.addEventListener('input', () => {
    fixes[idx] = inp.value;
    try { localStorage.setItem(KEY, JSON.stringify(fixes)); } catch(e) {}
    refresh();
  });
  box.append(meta, d, lab, inp);
  c.append(im, box);
  list.appendChild(c);
});
refresh();
document.getElementById('exp').addEventListener('click', () => {
  const out = DATA.map((r, i) => ({ page: r.page, image: r.img, current: r.alt,
                                    correction: (fixes[i] || '').trim() }))
                  .filter(o => o.correction);
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = 'alt-corrections.json'; a.click();
  URL.revokeObjectURL(u);
});
document.getElementById('clr').addEventListener('click', () => {
  if (!confirm('לנקות את כל התיקונים שהוקלדו?')) return;
  fixes = {};
  try { localStorage.removeItem(KEY); } catch(e) {}
  document.querySelectorAll('input[type=text]').forEach(i => i.value = '');
  refresh();
});
