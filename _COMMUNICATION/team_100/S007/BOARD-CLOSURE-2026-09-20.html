<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#f1f3f5; --surface:#fff; --surface-2:#f8f9fb;

  --nimrod:#2d6b8f; --eyal:#9a6a28; --team:#3d6b4e; --launch:#6d4a72;
  --st-open:#9a6a28; --st-work:#2d6b8f; --st-done:#3d6b4e; --st-hold:#8d8d8d;
  --sans:"Heebo",-apple-system,"Segoe UI",Arial,sans-serif;
  --serif:"Frank Ruhl Libre","Times New Roman",serif;
  --sp:clamp(18px,3vw,34px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14161a; --surface:#1d2026; --surface-2:#22262d;
    --ink:#e7e9ee; --muted:#98a0ab; --line:#2f343c; --line-soft:#272c33;
    --nimrod:#6aa8c9; --eyal:#d0a05c; --team:#77ab88; --launch:#b18ab5;
    --st-open:#d0a05c; --st-work:#6aa8c9; --st-done:#77ab88; --st-hold:#8d939c;
  }
}
:root[data-theme="dark"]{
  --ground:#14161a; --surface:#1d2026; --surface-2:#22262d;
  --ink:#e7e9ee; --muted:#98a0ab; --line:#2f343c; --line-soft:#272c33;
  --nimrod:#6aa8c9; --eyal:#d0a05c; --team:#77ab88; --launch:#b18ab5;
  --st-open:#d0a05c; --st-work:#6aa8c9; --st-done:#77ab88; --st-hold:#8d939c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:16.5px;line-height:1.6;direction:rtl}
.page{max-width:1080px;margin:0 auto;padding:var(--sp) clamp(14px,3vw,26px) 120px}

header.top{padding-bottom:20px;border-bottom:2px solid var(--ink);margin-bottom:22px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,4.4vw,2.6rem);
   margin:0 0 6px;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.stamp{font-size:.82rem;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}

.meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0 6px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
       border-top:3px solid var(--c)}
.mcard .n{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--c)}
.mcard .l{font-size:.86rem;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--c);width:0}

.filters{position:sticky;top:0;z-index:5;background:var(--ground);padding:12px 0 10px;
         border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.filters b{font-size:.84rem;color:var(--muted);font-weight:500;margin-inline-end:4px}
.chip{font:inherit;font-size:.86rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
      background:var(--surface);color:var(--ink);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--nimrod);outline-offset:2px}

section.owner{margin-top:34px}
.ohead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
       border-inline-start:5px solid var(--c);padding-inline-start:12px;margin-bottom:4px}
.ohead h2{font-family:var(--serif);font-size:1.5rem;margin:0;font-weight:700}
.ohead .who{font-size:.85rem;color:var(--c);font-weight:500}
.ohead .cnt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.onote{color:var(--muted);font-size:.93rem;margin:0 0 14px;padding-inline-start:17px;max-width:66ch}

h3.topic{font-size:.83rem;letter-spacing:.09em;color:var(--muted);font-weight:500;
         margin:20px 0 8px;padding-inline-start:17px}

.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;
      padding:14px 16px;margin-bottom:9px}
.item[data-done="1"]{background:var(--surface-2);opacity:.72}
.irow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{font-size:.76rem;padding:3px 9px;border-radius:999px;white-space:nowrap;
      background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc);
      border:1px solid color-mix(in srgb,var(--sc) 40%,transparent);font-weight:500}
.ttl{font-weight:500;flex:1 1 260px;min-width:0}
.ask{margin:8px 0 0;color:var(--ink)}
.why{margin:6px 0 0;color:var(--muted);font-size:.93rem}
.opts{margin:9px 0 0;padding:9px 12px;background:var(--surface-2);border-radius:8px;
      border-inline-start:3px solid var(--c)}
.opts .lb{font-size:.78rem;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:3px}
.opts ul{margin:0;padding-inline-start:18px}
.decided{margin:9px 0 0;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,transparent);border-inline-start:3px solid var(--c)}
.decided .lb{font-size:.78rem;letter-spacing:.07em;color:var(--c);display:block;margin-bottom:3px;font-weight:500}
.decided q{font-style:normal}
.tw{margin:9px 0 0;overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem;direction:ltr}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{background:var(--surface-2);font-weight:500;color:var(--muted);font-size:.8rem}
tr:last-child td{border-bottom:0}
.opts li{margin:2px 0}
.rec{margin:7px 0 0;font-size:.93rem}
.rec b{color:var(--c)}
.links{margin:9px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.85rem;padding:4px 10px;border:1px solid var(--line);border-radius:7px;
         text-decoration:none;color:var(--ink);background:var(--surface-2);min-height:32px;
         display:inline-flex;align-items:center}
.links a:hover{border-color:var(--c);color:var(--c)}
.resp{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);
      display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start}
select,textarea{font:inherit;font-size:.93rem;background:var(--surface);color:var(--ink);
       border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:40px}
select{min-width:130px}
textarea{flex:1 1 260px;min-height:40px;resize:vertical}

.tail{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);
      padding:11px clamp(14px,3vw,26px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:9}
.tail .grow{flex:1 1 auto;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
button.act{font:inherit;font-weight:500;padding:10px 18px;border-radius:9px;border:1px solid var(--ink);
       background:var(--ink);color:var(--ground);cursor:pointer;min-height:44px}
button.act.ghost{background:transparent;color:var(--ink)}
#out{position:fixed;inset:0;background:var(--ground);z-index:20;padding:clamp(14px,3vw,26px);
     display:none;flex-direction:column;gap:11px}
#out textarea{flex:1;width:100%;font-size:.9rem;direction:rtl;text-align:right}
.done-msg{color:var(--st-done);font-weight:500}
@media print{.filters,.tail,.resp,#out{display:none}.item{break-inside:avoid}}
</style>

const STATUSES=[["","— לא סומן —"],["ok","מאושר / סגור"],["fix","לתקן — כתבתי למטה"],["wait","להמתין"],["no","לא רלוונטי"]];
const KEY="ea-closure-board-v1";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
let db=null;

function id(i){return ITEMS[i].id}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function render(){
  const board=document.getElementById("board");
  board.textContent="";
  OWNERS.forEach(ow=>{
    const mine=ITEMS.map((it,i)=>({it,i})).filter(x=>x.it.o===ow.k);
    if(!mine.length) return;
    const sec=document.createElement("section");
    sec.className="owner"; sec.dataset.owner=ow.k; sec.style.setProperty("--c",ow.c);
    const openN=mine.filter(x=>{const q=state[id(x.i)]||{};return !x.it.done&&!q.s&&!q.n}).length;
    sec.innerHTML=
      '<div class="ohead"><h2>'+esc(ow.name)+'</h2><span class="who">'+esc(ow.who)+
      '</span><span class="cnt">'+mine.length+' סעיפים · '+openN+' עוד לא סומנו</span></div>'+
      '<p class="onote">'+esc(ow.note)+'</p>';
    let topic="";
    mine.forEach(({it,i})=>{
      if(it.t!==topic){topic=it.t;const h=document.createElement("h3");h.className="topic";h.textContent=topic;sec.appendChild(h)}
      sec.appendChild(itemEl(it,i,ow));
    });
    board.appendChild(sec);
  });
  meter(); tally(); applyFilter();
}

function itemEl(it,i,ow){
  const st=(state[id(i)]||{});
  const el=document.createElement("article");
  el.className="item"; el.dataset.owner=ow.k; el.dataset.i=i;
  el.style.setProperty("--c",ow.c);
  const marked = it.done || !!st.s || !!st.n;
  el.dataset.done = marked ? "1" : "0";
  const sc = it.done ? "var(--st-done)" : (st.s==="ok" ? "var(--st-done)" : (st.s||st.n) ? "var(--st-work)" : "var(--st-open)");
  const label = it.done ? "בוצע" : (st.s ? (STATUSES.find(x=>x[0]===st.s)||["",""])[1] : (st.n ? "הערה" : "פתוח"));
  let h='<div class="irow"><span class="pill" style="--sc:'+sc+'">'+esc(label)+'</span>'+
        '<span class="ttl">'+esc(it.h)+'</span></div>'+
        '<p class="ask">'+esc(it.ask)+'</p>';
  if(it.why) h+='<p class="why">'+esc(it.why)+'</p>';
  if(it.opts) h+='<div class="opts"><span class="lb">אפשרויות</span><ul>'+it.opts.map(o=>'<li>'+esc(o)+'</li>').join("")+'</ul></div>';
  if(it.rec) h+='<p class="rec"><b>ההמלצה שלנו:</b> '+esc(it.rec)+'</p>';
  if(it.decided) h+='<div class="decided"><span class="lb">ההכרעה שלך, כלשונה</span><q>'+esc(it.decided)+'</q></div>';
  if(it.table) h+='<div class="tw"><table><thead><tr>'+it.table[0].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+it.table.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  if(it.links) h+='<div class="links">'+it.links.map(l=>'<a href="'+S+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>').join("")+'</div>';
  if(!it.done){
    h+='<div class="resp"><select aria-label="סטטוס">'+
       STATUSES.map(s=>'<option value="'+s[0]+'"'+(st.s===s[0]?' selected':'')+'>'+esc(s[1])+'</option>').join("")+
       '</select><textarea placeholder="הערה — גם הערה בלי סטטוס נחשבת תשובה ונכנסת להעתקה" aria-label="הערה">'+esc(st.n||"")+'</textarea></div>';
  }
  el.innerHTML=h;
  const sel=el.querySelector("select"), ta=el.querySelector("textarea");
  if(sel) sel.addEventListener("change",()=>save(i,sel.value,ta.value,el,it));
  if(ta) ta.addEventListener("input",()=>{clearTimeout(ta._t);ta._t=setTimeout(()=>save(i,sel.value,ta.value,el,it),400)});
  return el;
}

function save(i,s,n,el,it){
  if(!s && !n) delete state[id(i)]; else state[id(i)]={s:s,n:n};
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(db){ try{ db.doc("board/answers").set({updated:new Date().toISOString(),answers:state}) }catch(e){} }
  el.dataset.done=(s||n)?"1":"0";
  const pill=el.querySelector(".pill");
  pill.textContent = s ? (STATUSES.find(x=>x[0]===s)||["",""])[1] : (n ? "הערה" : "פתוח");
  pill.style.setProperty("--sc", s==="ok"?"var(--st-done)": (s||n)?"var(--st-work)":"var(--st-open)");
  meter(); tally(); counts();
}

function counts(){
  document.querySelectorAll("section.owner").forEach(sec=>{
    const k=sec.dataset.owner;
    const mine=ITEMS.map((it,i)=>({it,i})).filter(x=>x.it.o===k);
    const openN=mine.filter(x=>{const q=state[id(x.i)]||{};return !x.it.done&&!q.s&&!q.n}).length;
    sec.querySelector(".cnt").textContent=mine.length+" סעיפים · "+openN+" עוד לא סומנו";
  });
}

function meter(){
  const m=document.getElementById("meter"); m.textContent="";
  OWNERS.forEach(ow=>{
    const mine=ITEMS.map((it,i)=>({it,i})).filter(x=>x.it.o===ow.k);
    const closed=mine.filter(x=>{const q=state[id(x.i)]||{};return x.it.done||q.s||q.n}).length;
    const d=document.createElement("div");
    d.className="mcard"; d.style.setProperty("--c",ow.c);
    d.innerHTML='<div class="n">'+closed+" / "+mine.length+'</div><div class="l">'+esc(ow.name)+
                '</div><div class="bar"><i style="width:'+(mine.length?Math.round(closed/mine.length*100):0)+'%"></i></div>';
    m.appendChild(d);
  });
}

function tally(){
  const total=ITEMS.length;
  const closed=ITEMS.filter((it,i)=>{const q=state[id(i)]||{};return it.done||q.s||q.n}).length;
  document.getElementById("tally").textContent="סומנו "+closed+" מתוך "+total+" סעיפים · נותרו "+(total-closed);
}

let filter="all";
function applyFilter(){
  document.querySelectorAll("section.owner").forEach(sec=>{
    let any=false;
    sec.querySelectorAll(".item").forEach(el=>{
      const i=+el.dataset.i, it=ITEMS[i];
      const q=state[id(i)]||{};const marked=it.done||!!q.s||!!q.n;
      let show=true;
      if(filter==="openonly") show=!marked;
      else if(filter!=="all") show=(it.o===filter);
      el.hidden=!show; if(show) any=true;
    });
    sec.querySelectorAll("h3.topic").forEach(h=>{
      let n=h.nextElementSibling, vis=false;
      while(n&&n.classList.contains("item")){ if(!n.hidden) vis=true; n=n.nextElementSibling }
      h.hidden=!vis;
    });
    sec.hidden=!any;
  });
}
document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  filter=b.dataset.f;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
  applyFilter();
});

function buildText(){
  const L=["משוב על לוח הסגירות — אייל עמית","נכתב בתאריך "+new Date().toLocaleDateString("he-IL"),""];
  OWNERS.forEach(ow=>{
    const rows=ITEMS.map((it,i)=>({it,i})).filter(x=>{const q=state[id(x.i)]||{};return q.s||q.n});
    const mine=rows.filter(x=>x.it.o===ow.k);
    if(!mine.length) return;
    L.push("## "+ow.name);
    mine.forEach(({it,i})=>{
      const st=state[id(i)];
      L.push("· "+it.h+" — "+(st.s?(STATUSES.find(x=>x[0]===st.s)||["",""])[1]:"הערה"));
      if(st.n) L.push("   "+st.n);
    });
    L.push("");
  });
  const un=ITEMS.filter((it,i)=>{const q=state[id(i)]||{};return !it.done&&!q.s&&!q.n});
  if(un.length){L.push("## עוד לא סומנו — "+un.length+" סעיפים");un.forEach(it=>L.push("· "+it.h));}
  return L.join("\n");
}
document.getElementById("btn-copy").addEventListener("click",()=>{
  const t=buildText();
  document.getElementById("out-text").value=t;
  document.getElementById("out").style.display="flex";
  copy(t);
});
document.getElementById("btn-copy2").addEventListener("click",()=>copy(document.getElementById("out-text").value));
document.getElementById("btn-close").addEventListener("click",()=>{document.getElementById("out").style.display="none"});
function copy(t){
  const m=document.getElementById("out-msg");
  const ta=document.getElementById("out-text"); ta.select();
  navigator.clipboard?.writeText(t).then(
    ()=>{m.textContent="הועתק ללוח";m.className="grow done-msg"},
    ()=>{try{document.execCommand("copy");m.textContent="הועתק ללוח";m.className="grow done-msg"}
         catch(e){m.textContent="בחר את הטקסט והעתק ידנית";m.className="grow"}}
  );
  setTimeout(()=>{m.textContent=""},5000);
}
document.getElementById("btn-clear").addEventListener("click",()=>{
  if(!confirm("לאפס את כל הסימונים וההערות?")) return;
  state={}; try{localStorage.removeItem(KEY)}catch(e){}
  if(db){try{db.doc("board/answers").set({updated:new Date().toISOString(),answers:{}})}catch(e){}}
  render();
});

ITEMS.forEach((it,i)=>{ if(it.st && !state[id(i)]) state[id(i)]={s:it.st,n:""} });
try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
document.getElementById("hdr-count").textContent=ITEMS.length+" סעיפים";
render();

(async()=>{
  try{
    const d=await window.claude?.use?.("db"); if(!d) return;
    db=d;
    const doc=await d.doc("board/answers").get();
    const saved=doc&&doc.answers;
    if(saved&&Object.keys(saved).length&&!Object.keys(state).length){
      state=saved; try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
      render();
    }
  }catch(e){}
})();
</script>
